<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--white); padding: var(--space-8) var(--space-10); display: flex; flex-direction: column; gap: var(--space-5); }
  .kicker { font-size: var(--text-xs); letter-spacing: var(--tracking-widest); text-transform: uppercase; color: var(--brand-red); font-weight: 700; }
  .claim { font-family: var(--font-display); font-weight: 700; font-size: var(--text-2xl); line-height: 1.05; letter-spacing: var(--tracking-tight); color: var(--ink-900); }
  .claim em { color: var(--brand-red); font-style: normal; }
  .sub { font-size: var(--text-sm); color: var(--ink-600); max-width: 60ch; }
</style>
</head>
<body>
  <span class="kicker">12 meses em 12 semanas</span>
  <h2 class="claim">Retome o controle do seu <em>crescimento</em>.</h2>
  <p class="sub">Voz séria e direta que transmite autoridade. Afirmamos, não pedimos. Método sobre promessa, resultado real sobre hype.</p>
</body>
</html>
