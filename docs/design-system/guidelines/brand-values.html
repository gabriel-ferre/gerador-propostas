<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--ink-800); display: flex; gap: 1px; padding: 0; }
  .v { flex: 1; padding: var(--space-8) var(--space-6); display: flex; flex-direction: column; gap: 6px; }
  .v .n { font-size: var(--text-xs); color: var(--ink-500); font-weight: 700; }
  .v .w { font-family: var(--font-display); font-weight: 700; font-size: var(--text-lg); color: var(--white); letter-spacing: var(--tracking-wide); text-transform: uppercase; }
  .v.red { background: var(--brand-red); }
  .v.red .n { color: rgba(255,255,255,0.65); }
  .v.dark { background: var(--ink-900); }
</style>
</head>
<body>
  <div class="v dark"><span class="n">01</span><span class="w">Exclusivo</span></div>
  <div class="v red"><span class="n">02</span><span class="w">Sofisticado</span></div>
  <div class="v dark"><span class="n">03</span><span class="w">Autêntico</span></div>
</body>
</html>
