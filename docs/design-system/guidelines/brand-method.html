<!-- @dsCard group="Brand" viewport="700x180" name="Método 12x12" subtitle="Oferta · Demanda · Conversão · Recompra" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--white); padding: var(--space-6) var(--space-8); display: flex; align-items: center; gap: var(--space-3); }
  .step { flex: 1; border: 1.5px solid var(--ink-200); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: 6px; position: relative; }
  .step .num { font-family: var(--font-mono); font-size: 11px; color: var(--brand-red); font-weight: 700; }
  .step .t { font-family: var(--font-display); font-weight: 700; font-size: var(--text-sm); color: var(--ink-900); text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.1; }
  .arrow { color: var(--ink-300); font-size: 20px; flex: none; }
</style>
</head>
<body>
  <div class="step"><span class="num">01</span><span class="t">Oferta<br>Irresistível</span></div>
  <span class="arrow">→</span>
  <div class="step"><span class="num">02</span><span class="t">Demanda<br>Qualificada</span></div>
  <span class="arrow">→</span>
  <div class="step"><span class="num">03</span><span class="t">Conversão<br>Otimizada</span></div>
  <span class="arrow">→</span>
  <div class="step"><span class="num">04</span><span class="t">Recompra<br>Sistemática</span></div>
</body>
</html>
