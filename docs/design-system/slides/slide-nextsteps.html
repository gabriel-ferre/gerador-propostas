<!-- @dsCard group="Slides" viewport="1280x720" name="Próximos passos" subtitle="Encerramento — ativação" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body { margin:0; }
  .slide { width:1280px; height:720px; background:var(--ink-950); color:var(--white); position:relative;
           font-family:var(--font-sans); padding:64px 80px; box-sizing:border-box; display:flex; flex-direction:column; }
  .eyebrow { font-size:13px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--red-400); margin-bottom:14px; }
  h2 { font-size:50px; line-height:1; letter-spacing:-0.02em; margin:0 0 56px; font-weight:700; max-width:20ch; }
  .steps { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
  .step { border-top:2px solid var(--brand-red); padding-top:22px; }
  .n { font-family:var(--font-mono); font-size:13px; color:var(--brand-red); font-weight:700; }
  .t { font-size:24px; font-weight:700; line-height:1.1; margin:14px 0 8px; }
  .d { font-size:14px; line-height:1.45; color:var(--ink-400); }
  .footer { margin-top:auto; display:flex; align-items:center; justify-content:space-between; }
  .cta { display:inline-flex; align-items:center; gap:10px; background:var(--brand-red); color:#fff; font-weight:700; font-size:17px;
         padding:15px 28px; border-radius:var(--radius-pill); }
  .logo { height:30px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">Próximos passos</div>
    <h2>O começo da sua retomada de crescimento.</h2>
    <div class="steps">
      <div class="step"><span class="n">01</span><div class="t">Realizar pagamento</div><div class="d">Condição definida no plano escolhido.</div></div>
      <div class="step"><span class="n">02</span><div class="t">Grupo no WhatsApp</div><div class="d">Canal direto com o time Retrieve.</div></div>
      <div class="step"><span class="n">03</span><div class="t">Briefing de entrada</div><div class="d">Mapeamento de cenário e metas.</div></div>
      <div class="step"><span class="n">04</span><div class="t">Call de start</div><div class="d">Kickoff e início das 12 semanas.</div></div>
    </div>
    <div class="footer">
      <span class="cta">Vamos começar →</span>
      <img class="logo" src="../assets/logos/retrieve-logo-white.png" alt="Retrieve">
    </div>
  </div>
</body>
</html>
